# Continuous deployment: every commit on main runs the tests, builds both
# images (web + MCP) tagged by commit SHA, and reconciles Dokploy against the
# repository through the embedded provisioner (provision/). Pull requests run
# the tests and a build without pushing anything.
#
# The same jobs run on merge_group, the event the merge queue fires on the
# temporary branch holding main plus the pull requests queued ahead. A required
# check missing from that event never reports, and the pull request then sits in
# the queue until it times out, so every required job stays free of an event
# filter. Only deploy is held back, by the ref guard it already had.
#
# The deploy job is separate on purpose: environment secrets are only handed to
# the job that declares the environment, so the Dokploy token (instance-wide,
# not scoped to one project) never shares a process with the Docker actions.
#
# Actions are pinned by commit rather than by tag: a tag is a moving target its
# owner can repoint (see the tj-actions/changed-files leak, 2025).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The check reads back to the merge base, so the shallow clone that
          # checkout takes by default is not enough.
          fetch-depth: 0
      - run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - run: scripts/check-migration-numbers.sh

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
          POSTGRES_DB: abacus_test
        # 5544 matches the DATABASE_URL hardcoded in the root test script.
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U abacus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same extensions as the socle provisioner creates per application database.
      - run: |
          psql postgresql://abacus:abacus@127.0.0.1:5544/abacus_test \
            -c 'create extension if not exists vector' \
            -c 'create extension if not exists pg_trgm' \
            -c 'create extension if not exists unaccent'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm typecheck` already covers the web app. What the build adds is the
      # route types Next generates under .next/types, and that the app builds.
      - run: pnpm --filter @abacus/web build
        env:
          BETTER_AUTH_SECRET: ci-build-only

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: mcp
            dockerfile: apps/mcp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pikmine-lab/abacus-${{ matrix.name }}
          # sha-<short> is what gets deployed: immutable, names exactly one
          # build. `latest` is a convenience for pulling by hand.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the Dokploy and application secrets. Restricted to main in the
    # repository settings: a workflow on any other branch cannot read them.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # The provisioner has zero dependencies (Node runs the TypeScript
      # directly), so nothing is installed in the job that holds the token.
      - name: Reconcile Dokploy against the repository
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          export IMAGE_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          node provision/src/provision.ts
