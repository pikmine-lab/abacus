# Every commit on main runs the tests against a database identical to the
# socle (pgvector/pgvector:pg16 + extensions), then builds the MCP image.
# The image is pushed to GHCR only from main; deployment stays a separate,
# explicit Dokploy API call (pikmine-lab convention: never auto-deploy).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
          POSTGRES_DB: abacus_test
        # 5544 matches the DATABASE_URL hardcoded in the root test script.
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U abacus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same extensions as the socle provisioner creates per application database.
      - run: |
          psql postgresql://abacus:abacus@127.0.0.1:5544/abacus_test \
            -c 'create extension if not exists vector' \
            -c 'create extension if not exists pg_trgm' \
            -c 'create extension if not exists unaccent'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The web app typechecks through its own Next build (JSX config lives there).
      - run: pnpm --filter @abacus/web build
        env:
          BETTER_AUTH_SECRET: ci-build-only

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mcp/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/pikmine-lab/abacus-mcp:latest
            ghcr.io/pikmine-lab/abacus-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
