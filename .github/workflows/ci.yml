# Continuous deployment: every commit on main runs the tests, builds both
# images (web + MCP) tagged by commit SHA, and reconciles Dokploy against the
# repository through the embedded provisioner (provision/). Pull requests run
# the tests and a build without pushing anything.
#
# The same jobs run on merge_group, the event the merge queue fires on the
# temporary branch holding main plus the pull requests queued ahead. A required
# check missing from that event never reports, and the pull request then sits in
# the queue until it times out, so every required job stays free of an event
# filter. Only deploy is held back, by the ref guard it already had.
#
# The `main` ruleset requires these checks by their full job names, matrix
# included (`build (web, apps/web/Dockerfile)`). Renaming a job, a Dockerfile or
# the matrix leaves the ruleset waiting for a check that never reports, and
# every pull request stuck: update the ruleset in the same change.
#
# The deploy job is separate on purpose: it is the only job granted an OIDC
# token, so what it reads from the vault (the Dokploy token, the application
# secrets) never shares a process with the Docker actions.
#
# Actions are pinned by commit rather than by tag: a tag is a moving target its
# owner can repoint (see the tj-actions/changed-files leak, 2025).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The check reads back to the merge base against origin/main, which
          # the shallow single-branch clone checkout takes by default has
          # neither of.
          fetch-depth: 0
      - run: scripts/check-migration-numbers.sh

  # baudrier check-agents-md CI job, version 2.
  #
  # Checks every AGENTS.md and CLAUDE.md, with the amendment limits measured from
  # the pull request's base, or from the default branch on a push or in the merge
  # queue.
  agents-md:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The amendment limits diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check AGENTS.md and CLAUDE.md
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: node scripts/check-agents-md.mjs --base "$BASE"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
        # 5544 matches the port of the local dev database.
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U abacus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each package creates its own database under this base on its first
      # test, with its extensions (scripts/test-db.mjs).
      TEST_DATABASE_URL: postgresql://abacus:abacus@127.0.0.1:5544/abacus_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request runs only what changed since its merge base with main.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-test-placement.mjs
      - run: pnpm typecheck
      # The web driver of the use case suite plays its cases in Chromium.
      - run: pnpm --filter @abacus/web exec playwright install --with-deps chromium --only-shell
      # The tests of the harness itself and of the Spec Kit extensions, outside
      # every package: always run, they take seconds.
      - run: pnpm run test:repo
      # The package tests and the use cases go through pnpm pipeline. On a pull
      # request, only the projects touched since main and those depending on
      # them run, the others restored from the cache; on main and in the merge
      # queue, everything runs, nothing taken from a cache, since main goes to
      # production. No retry anywhere: a flaky test is fixed, not replayed.
      # What decides a result from outside the packages (the migrations, the
      # test harness) reaches the cache key as a fingerprint.
      - run: echo "ABACUS_TESTED_FILES=$(cat migrations/*.sql scripts/*.mjs | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: ~/.cache/pnpm/pipeline
          key: pipeline-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: pipeline-${{ github.head_ref }}-
      # pnpm counts a file at the root as touching every project: a pull
      # request changing only documentation would rerun everything.
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qv '\.md$'; then
            echo "run=affected" >> "$GITHUB_OUTPUT"
          else
            echo "run=none" >> "$GITHUB_OUTPUT"
            echo 'Only documentation changed: no test to run.'
          fi
      - if: github.event_name == 'pull_request' && steps.scope.outputs.run == 'affected'
        run: pnpm pipeline --base "origin/${{ github.base_ref }}"
      - if: github.event_name != 'pull_request'
        run: pnpm pipeline --full --no-cache
      # `pnpm typecheck` already covers the web app, the route types Next
      # generates under .next/types included. What the build adds is that the
      # app builds.
      - run: pnpm --filter @abacus/web build
        env:
          BETTER_AUTH_SECRET: ci-build-only
          MCP_URL: https://build.invalid/mcp

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: mcp
            dockerfile: apps/mcp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pikmine-lab/abacus-${{ matrix.name }}
          # sha-<short> is what gets deployed: immutable, names exactly one
          # build. `latest` is a convenience for pulling by hand.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # The same build, from the cache, unpacked to check what the image carries:
      # no test file, test or driver folder, nothing of the use case suite.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=local,dest=${{ runner.temp }}/image
          cache-from: type=gha,scope=${{ matrix.name }}
      - run: node scripts/check-image-content.mjs "$RUNNER_TEMP/image/app"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No GitHub secret: the provisioner trades the job's OIDC token for vault
    # access (provision/src/vault.ts). The vault only honours a token signed for
    # main, so no `environment:` here: it would change the token's subject.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # The provisioner has zero dependencies (Node runs the TypeScript
      # directly), so nothing is installed in the job that holds the token.
      - name: Reconcile Dokploy against the repository
        env:
          # A repository variable, not a secret: the vault honours it only with
          # a token GitHub signed for main of this repository.
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: |
          export IMAGE_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          node provision/src/provision.ts
