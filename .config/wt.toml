# Bootstrapping a worktree for parallel development. `pre-start` and
# `post-start` fire only when a worktree is created, so everything here is
# one-time setup for a new branch. Inert for anyone not using worktrunk.

[step.copy-ignored]
# pnpm's node_modules is a symlink farm pointing back inside the source
# worktree, so copying it leaves dangling links. A fresh install hardlinks from
# the pnpm store and takes about a second. The Next build cache is rebuilt on
# first request and is not worth carrying over either.
exclude = ["node_modules/", ".next/"]

[[pre-start]]
ignored-files = "wt step copy-ignored"

[[pre-start]]
submodules = "git submodule update --init --recursive"

[[pre-start]]
deps = "ni --frozen-lockfile"

[[pre-start]]
# Cloning the dev database brings its data along, which this model needs: every
# movement is entered by hand, so an empty database means no functional
# validation. TEMPLATE requires no open connection to the source database.
# The compose file is resolved from the primary worktree: the dev database is a
# shared resource owned by it, and a branch predating this file would not
# carry the pinned project name.
database = """
docker compose -f {{ primary_worktree_path }}/compose.dev.yml exec -T db \
  psql -U abacus -d postgres \
  -c 'CREATE DATABASE abacus_{{ branch | sanitize_db }} TEMPLATE abacus'
"""

[[pre-start]]
# Ask portless for this worktree's URL rather than spelling it out: the scheme
# and the proxy port belong to the local portless setup, not here. Stored as a
# branch variable so every consumer below agrees on one value.
# --no-worktree because the name already carries the branch: without it,
# `portless get` prefixes the branch it detects once more, while the
# `portless <name>` that serves the route in post-start keeps the name as is.
dev-url = """
wt config state vars set dev-url="$(portless get --no-worktree {{ branch | sanitize }}.abacus)"
"""

[[pre-start]]
# The MCP server's own route, for when the OAuth flow is tried against a real
# client: every access token is bound to this exact address.
mcp-url = """
wt config state vars set mcp-url="$(portless get --no-worktree {{ branch | sanitize }}-mcp.abacus)/mcp"
"""

[[pre-start]]
# PUBLIC_URL matters as much as DATABASE_URL here: Better Auth validates the
# base URL, so leaving the source worktree's value breaks sign-in in this one.
# MCP_URL is required too, and a source file predating it has no line to edit:
# it is dropped and appended by sed, which also terminates an unterminated last
# line (a shell append would glue onto it).
env = """
sed -i \
  -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://abacus:abacus@127.0.0.1:5544/abacus_{{ branch | sanitize_db }}#' \
  -e 's#^PUBLIC_URL=.*#PUBLIC_URL={{ vars["dev-url"] }}#' \
  -e '$a MCP_URL={{ vars["mcp-url"] }}' \
  -e '/^MCP_URL=/d' \
  apps/web/.env.local
"""

[[pre-start]]
# The clone is only as recent as the last `nr migrate:dev` on the dev database,
# so it often lags this branch, and nothing fails until a screen reads a missing
# column. Reading the URL from .env.local migrates the very database the app
# opens; on an up-to-date database the runner applies nothing.
migrate = "node --env-file=apps/web/.env.local packages/core/src/db/migrate.ts"

[post-start]
# portless names the route instead of allocating a port, and `wt step tether`
# kills the dev server when the worktree is removed.
web = "wt step tether -- portless {{ branch | sanitize }}.abacus pnpm --filter @abacus/web dev"

[list]
url = '{{ vars["dev-url"] }}'

[[pre-remove]]
# Stop the dev server before anything is deleted. `wt step tether` stops it only
# once the worktree path is gone, and Next recreates apps/web/.next/dev the
# instant its cache disappears: the path never goes, and the server outlives the
# worktree. portless stops the server it runs on SIGTERM. `[/]` keeps the
# pattern from matching this hook's own command line.
server = """
pkill -TERM -f '[/]portless {{ branch | sanitize }}.abacus '
for _ in $(seq 50); do
  pgrep -f '[/]portless {{ branch | sanitize }}.abacus ' > /dev/null || exit 0
  sleep 0.2
done
echo 'dev server still running after 10 s' >&2
exit 1
"""

[[pre-remove]]
# FORCE closes any connection still open, a plain DROP refusing a database in
# use: the server's while it finishes closing them, or another client's.
database = """
docker compose -f {{ primary_worktree_path }}/compose.dev.yml exec -T db \
  psql -U abacus -d postgres \
  -c 'DROP DATABASE IF EXISTS abacus_{{ branch | sanitize_db }} WITH (FORCE)'
"""
