packages:
  - apps/*
  - packages/*
# next-intl pulls these for its message extractor, which abacus does not use:
# their install scripts only build native fallbacks, not needed at runtime.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  # Its install script only marks its binary executable, which its launcher
  # does again itself. Its browser is installed once per machine, never here.
  agent-browser: false

# The tests, run by `pnpm pipeline`: only the projects touched since the base
# and those depending on them, each result restored from the cache when
# nothing it depends on changed. The migrations live outside the packages and
# still decide a result: they reach the cache key through ABACUS_TESTED_FILES,
# a fingerprint the CI computes.
tasks:
  test:
    dependsOn: ['^test']
    outputs: []
    inputs: ['**/*.ts', '**/*.tsx', '**/*.mjs', '**/*.json', '**/*.css']
    env: ['ABACUS_TESTED_FILES']

pipelines:
  default: [test]
