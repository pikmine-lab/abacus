schema_version: "1.0"

preset:
  id: "abacus"
  name: "abacus"
  version: "1.1.0"
  description: "Adapts the Spec Kit cycle to abacus: artifacts in the feature's issue, cases and refusals in the spec, review declared by the plan, tests before code in each task, converge through code and test review up to human validation."
  author: "pikmine-lab"
  repository: "https://github.com/pikmine-lab/abacus"
  license: "MIT"

requires:
  speckit_version: ">=1.2.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Cases and refusals, each with its named error code and bounds"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      description: "Test strategy, review level and constitution deviations"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-addendum.md"
      description: "Code tasks as batches citing their cases, each carrying its tests"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Specify from the feature's issue, into its cache"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan with the review level and the constitution deviations"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tasks that each carry their tests"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement every code task, its tests before its code"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Converge through code review, test review, security review, functional and human validation"
      strategy: "wrap"
    - type: "command"
      name: "speckit.assess.decide"
      file: "commands/speckit.assess.decide.md"
      description: "Turn the verdict into the feature's issue, or a closed one"
      strategy: "wrap"
    - type: "command"
      name: "speckit.bug.assess"
      file: "commands/speckit.bug.assess.md"
      description: "Diagnose a bug into its issue"
      strategy: "wrap"
    - type: "command"
      name: "speckit.bug.fix"
      file: "commands/speckit.bug.fix.md"
      description: "Fix a bug from a test that reproduces it, then review the fix and its tests"
      replaces: "speckit.bug.fix"

tags:
  - "abacus"
