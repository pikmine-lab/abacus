    <circle cx="7" cy="16" r="1" />
    <circle cx="13" cy="16" r="1" />
    <circle cx="7" cy="22" r="1" />
  </g>
  <g fill="#e2a04c">
    <rect x="22.6" y="7.6" width="4.8" height="4.8" rx="1.1" />
    <rect x="16.6" y="13.6" width="4.8" height="4.8" rx="1.1" />
    <rect x="22.6" y="13.6" width="4.8" height="4.8" rx="1.1" />
    <rect x="10.6" y="19.6" width="4.8" height="4.8" rx="1.1" />
